name: Release

# Continuous release. Pushing a `v*` tag publishes a package built from that exact
# commit; a manual run (`workflow_dispatch`) does the same from the current branch
# and derives the tag from package.json, so "publish what is on main" needs no
# local tag dance — and re-running either one repairs a release instead of
# creating a second one.
#
# The asset is `git archive` of the released commit plus the npm tarball. Both
# are built from the same commit, and the gates below verify the *built* bytes,
# not the checkout.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as a draft (invisible to everyone until you publish it)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Resolve the release identity
        id: identity
        run: |
          set -euo pipefail
          NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          if [ -z "$NAME" ] || [ -z "$VERSION" ]; then
            echo "::error::package.json must carry both \`name\` and \`version\`"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing ${NAME} ${VERSION}"

      - name: Refuse to reuse a version that belongs to another commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.target_commitish' 2>/dev/null)"; then
            :
          else
            echo "No release for ${TAG} yet."
            exit 0
          fi
          EXISTING_SHA="$(git rev-parse --verify --quiet "${EXISTING}^{commit}" || echo '')"
          if [ -z "$EXISTING_SHA" ]; then
            echo "::error::release ${TAG} exists and targets '${EXISTING}', which this checkout cannot resolve — inspect that release before reusing this version"
            exit 1
          fi
          if [ "$EXISTING_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::release ${TAG} was created from ${EXISTING_SHA:0:7}, but this run builds ${GITHUB_SHA:0:7}. Bump the version."
            exit 1
          fi
          echo "Release ${TAG} already belongs to this commit; replacing its assets is safe."

      - name: Gate the tag against package.json
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED: v${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::tag $TAG was pushed, but package.json declares $EXPECTED — bump the version or move the tag"
            exit 1
          fi

      - name: Build the release package
        env:
          NAME: ${{ steps.identity.outputs.name }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ARCHIVE="dist/${NAME}-${VERSION}.zip"
          git archive --format=zip --prefix="${NAME}-${VERSION}/" -o "$ARCHIVE" "$GITHUB_SHA"
          npm pack --pack-destination dist >/dev/null
          (cd dist && sha256sum "${NAME}-${VERSION}.zip" "${NAME}-${VERSION}.tgz" > SHA256SUMS.txt)
          ls -l dist
          cat dist/SHA256SUMS.txt

      - name: Prove the archive carries the plugin and no machine state
        env:
          NAME: ${{ steps.identity.outputs.name }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          ARCHIVE="dist/${NAME}-${VERSION}.zip"
          STAGE="$(mktemp -d)"
          unzip -q "$ARCHIVE" -d "$STAGE"
          TREE="$STAGE/${NAME}-${VERSION}"

          if unzip -l "$ARCHIVE" | grep -qE '(^| )(_?node_modules|\.git)/'; then
            echo "::error::the archive carries node_modules/ or .git/"
            exit 1
          fi
          for required in package.json cordis.patch.yml entry.js lib/client.js src/client.js tools/verify-client.mjs build-client.mjs LICENSE README.md; do
            if [ ! -e "$TREE/$required" ]; then
              echo "::error::the archive is missing $required"
              exit 1
            fi
          done
          echo "Archive contract OK."

      - name: Prove the tarball is self-contained
        env:
          NAME: ${{ steps.identity.outputs.name }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          tar -xzf "dist/${NAME}-${VERSION}.tgz" -C "$STAGE"
          for required in package.json cordis.patch.yml entry.js lib/client.js src/client.js tools/verify-client.mjs LICENSE README.md; do
            test -f "$STAGE/package/$required"
          done
          echo "Tarball contract OK."

      - name: Run the offline suite against the unpacked archive
        env:
          NAME: ${{ steps.identity.outputs.name }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          unzip -q "dist/${NAME}-${VERSION}.zip" -d "$STAGE"
          # This runs the checker against the RELEASED BYTES, not the checkout.
          node "$STAGE/${NAME}-${VERSION}/tools/verify-client.mjs"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.identity.outputs.name }}
          VERSION: ${{ steps.identity.outputs.version }}
          DRAFT_INPUT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v${VERSION}"
            if [ "$DRAFT_INPUT" = "true" ]; then DRAFT="--draft"; else DRAFT=""; fi
          else
            TAG="$GITHUB_REF_NAME"
            DRAFT=""
          fi
          echo "Publishing $TAG (draft: ${DRAFT:-no})"
          TITLE="dsh-math-copy ${TAG} — 把公式复制成能重新渲染的 TeX"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$TITLE"
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md $DRAFT
          fi
          gh release view "$TAG" --json tagName,isDraft,assets \
            --jq '{tag: .tagName, draft: .isDraft, assets: [.assets[].name]}'
